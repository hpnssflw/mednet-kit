name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) и provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing требует npm 11.5.1+
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'Релиз пакетов @mednet/*'
          commit: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      # changesets/action v1 не понимает вывод changesets 3: теги создаются только локально,
      # GitHub Releases не появляются. Досылаем теги с HEAD и создаём релизы из CHANGELOG.
      - name: Теги и GitHub Releases
        run: |
          for tag in $(git tag --points-at HEAD --list '@mednet/*'); do
            git push origin "refs/tags/$tag"
            version="${tag##*@}"
            package="${tag%@*}"
            notes=$(awk -v heading="## $version" '$0 == heading { found = 1; next } /^## / { found = 0 } found' "packages/${package#@mednet/}/CHANGELOG.md")
            gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "$notes"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
